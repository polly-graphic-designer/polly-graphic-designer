<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Polly Graphic Designer — Design, Branding, Printing, Social Media Ads Management, Mobile Photography & Videography in Kampala, Uganda.">

<title>Polly Graphic Designer | Design • Brand • Print</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
  --bg:#08070b;
  --card:#0f0d14;
  --gold:#d7b45a;
  --gold-light:#f0d98a;
  --text:#f5f1e8;
  --muted:#aaa6b0;
  --line:rgba(255,255,255,.10);
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Montserrat',sans-serif;
  line-height:1.6;
}

a{
  color:inherit;
  text-decoration:none;
}

img{
  max-width:100%;
}

.wrap{
  width:min(1120px,92%);
  margin:auto;
}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(8,7,11,.94);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}

.nav{
  min-height:75px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.brand{
  font-family:'Cormorant Garamond',serif;
  font-size:30px;
  font-weight:700;
  color:var(--gold);
}

nav{
  display:flex;
  gap:22px;
  align-items:center;
}

nav a{
  font-size:12px;
  letter-spacing:1px;
  text-transform:uppercase;
  color:#ddd8df;
}

nav a:hover{
  color:var(--gold);
}

/* HERO */

.hero{
  padding:100px 0 90px;
}

.hero-grid{
  display:grid;
  grid-template-columns:1.1fr .9fr;
  gap:60px;
  align-items:center;
}

.eyebrow,
.section-kicker{
  color:var(--gold);
  font-size:11px;
  letter-spacing:3px;
  font-weight:600;
}

h1,
h2,
h3{
  font-family:'Cormorant Garamond',serif;
}

h1{
  font-size:clamp(55px,8vw,90px);
  line-height:.9;
  margin:18px 0 25px;
}

h1 span{
  color:var(--gold);
}

h2{
  font-size:52px;
  line-height:1;
  margin:12px 0 20px;
}

h3{
  font-size:25px;
}

.lead,
.section-intro{
  color:var(--muted);
  font-size:15px;
  max-width:700px;
}

.cta{
  display:flex;
  gap:12px;
  margin-top:30px;
  flex-wrap:wrap;
}

.btn{
  display:inline-block;
  padding:13px 22px;
  border:1px solid rgba(215,180,90,.5);
  font-size:12px;
  letter-spacing:1px;
  text-transform:uppercase;
}

.btn.primary{
  background:var(--gold);
  color:#08070b;
}

.btn:hover{
  background:var(--gold);
  color:#08070b;
}

.hero-card{
  border:1px solid rgba(215,180,90,.25);
  background:#0d0b11;
  padding:10px;
}

.hero-card img{
  width:100%;
  display:block;
}

/* SECTIONS */

section{
  padding:90px 0;
}

.about{
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
}

.about-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:60px;
  align-items:center;
}

.quote{
  font-family:'Cormorant Garamond',serif;
  font-size:36px;
  color:var(--gold-light);
  border-left:2px solid var(--gold);
  padding-left:30px;
}

/* SERVICES */

.services{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
  margin-top:35px;
}

.service{
  background:var(--card);
  border:1px solid var(--line);
  padding:28px;
}

.service:hover{
  border-color:var(--gold);
}

.num{
  color:var(--gold);
  font-size:12px;
  letter-spacing:2px;
}

.service p{
  color:var(--muted);
  font-size:13px;
}

/* PORTFOLIO */

.portfolio{
  border-top:1px solid var(--line);
}

.portfolio-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
  margin-top:35px;
}

.portfolio-card{
  display:block;
  overflow:hidden;
  border:1px solid var(--line);
  background:var(--card);
  transition:.3s;
}

.portfolio-card:hover{
  transform:translateY(-5px);
  border-color:var(--gold);
}

.portfolio-card img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  display:block;
}

/* CONTACT */

.contact{
  border-top:1px solid var(--line);
  text-align:center;
}

.contact-box{
  border:1px solid rgba(215,180,90,.25);
  background:var(--card);
  padding:45px;
  margin-top:30px;
}

.contact-box p{
  color:var(--muted);
}

.social-links{
  display:flex;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
  margin-top:25px;
}

.social-links a{
  border:1px solid rgba(215,180,90,.45);
  padding:11px 16px;
  color:var(--gold);
  font-size:12px;
  transition:.3s;
}

.social-links a:hover{
  background:var(--gold);
  color:#08070b;
}

/* FOOTER */

footer{
  border-top:1px solid var(--line);
  padding:30px 0;
  text-align:center;
  color:#77737c;
  font-size:11px;
}
